# hypridle — DISPLAY BLANKING ONLY. Added 2026-09-05.
#
# Omarchy's own idle service (omarchy-shell, quickshell) owns the screensaver and
# the lock screen; its timeouts live in ~/.config/omarchy/shell.json under
# { "idle": { "screensaver": ..., "lock": ... } }. That service reads those TWO
# keys and nothing else — Omarchy 4.0.1 has no display-off step at all, which is
# the gap this file fills. Verified against
# /usr/share/omarchy/shell/plugins/services/idle/Service.qml on 2026-09-05.
#
# 🔴 Hyprland 0.56.2 uses a Lua dispatch API. `hyprctl dispatch dpms off` — the
# form in every hypridle guide and every Omarchy thread — FAILS here with a Lua
# parse error and blanks nothing. The working call is hl.dsp.dpms({action=...}),
# proven on this box 2026-09-05.

general {
    # Deliberately no lock_cmd and no before_sleep_cmd: locking belongs to
    # omarchy-system-lock. Setting one here would give this box two lock screens.

    # Idle inhibitors (Chromium video playback, systemd-inhibit) are RESPECTED,
    # matching Omarchy's own behaviour. If the display is again found on all
    # morning, uncomment these — an inhibitor held idle off for 25.5 hours on
    # 2026-09-04, which is why the box never even reached its lock screen.
    # ignore_wayland_inhibit = true
    # ignore_systemd_inhibit = true
    # ignore_dbus_inhibit = true

    inhibit_sleep = 0   # we run no lock_cmd, so hypridle has nothing to delay suspend for
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900   # 15 min — between the screensaver (600) and the lock (1800)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
