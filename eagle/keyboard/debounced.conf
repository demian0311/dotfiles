# systemd drop-in for debounced.service (/etc/systemd/system/debounced.service.d/).
# The packaged unit only starts the daemon; it attaches to no keyboard until
# `debouncectl start` is sent over its socket. This drop-in attaches it to the
# built-in applespi keyboard after the socket appears, so a boot needs no hand.
# The unit has no XDG_RUNTIME_DIR, so daemon and attach script both use
# /tmp/debounced.sock (get_socket_path in src/debounced.c). From a user shell,
# `debouncectl` looks in /run/user/$UID and would spawn a second, user-owned
# daemon: always query it with `sudo env -u XDG_RUNTIME_DIR debouncectl status`.
[Service]
ExecStart=
ExecStart=/usr/bin/debounced -v
ExecStartPost=/usr/local/libexec/eagle-debounced-attach
Environment=DEBOUNCE_DEV=/dev/input/by-path/pci-0000:00:1e.3-platform-pxa2xx-spi.3-cs-00-event-kbd
Environment=DEBOUNCE_MS=50
Environment=DEBOUNCE_SOCK=/tmp/debounced.sock
