# S3 on this MacBookAir6,2 intermittently loses power outright, so a closed lid
# must end up on disk. Plain suspend here; 80-eagle-lid-hibernate (system-sleep
# hook) arms a 30min RTC alarm and hibernates only if the lid is still closed
# when it wakes. logind's own suspend-then-hibernate hibernated on lid OPEN
# whenever the alarm was missed (dotfiles issue #4).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
